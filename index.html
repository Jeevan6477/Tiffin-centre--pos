<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sri Tiffin POS</title>
  <meta name="theme-color" content="#991b1b" />

  <style>
    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
    }

    body { 
      background: #180505;
      color: #f3f4f6;
      padding: 12px; 
      padding-bottom: 140px; 
      min-height: 100vh;
    }

    header { 
      background: #991b1b;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px; 
      padding: 14px 18px; 
      margin-bottom: 12px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    
    header h1 { font-size: 1.35rem; font-weight: 800; color: #fff; }
    .token-badge { 
      background: #ffffff;
      color: #991b1b; 
      padding: 6px 14px; 
      border-radius: 30px; 
      font-weight: 900; 
      font-size: 1rem; 
    }

    .status-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 0.85rem;
      font-weight: 700;
      color: #e5e7eb;
      cursor: pointer;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .nav-tabs button { 
      flex: 1; 
      padding: 12px 4px; 
      border-radius: 12px; 
      font-weight: 700; 
      font-size: 0.95rem; 
      cursor: pointer; 
      background: rgba(255, 255, 255, 0.08); 
      color: #d1d5db; 
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .nav-tabs button.active { 
      background: #dc2626;
      color: #ffffff; 
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    /* POS Item Grid */
    .menu-grid { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 12px; 
      margin-bottom: 16px; 
    }
    .card { 
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px; 
      overflow: hidden; 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      display: flex; 
      flex-direction: column; 
    }
    .card-img { 
      width: 100%; 
      height: 100px; 
      object-fit: cover; 
      background: #2b0b0b;
    }
    .card-body { 
      padding: 12px 8px; 
      text-align: center; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      flex: 1; 
    }
    .card h4 { font-size: 1.1rem; font-weight: 800; color: #ffffff; margin-bottom: 4px; }
    .card .price { color: #4ade80; font-weight: 800; font-size: 1.25rem; margin-bottom: 10px; }
    
    .controls { display: flex; justify-content: center; align-items: center; gap: 12px; }
    .btn-qty { 
      width: 44px; 
      height: 44px; 
      background: rgba(255, 255, 255, 0.25); 
      border: 1px solid rgba(255, 255, 255, 0.4); 
      border-radius: 10px; 
      color: #ffffff; 
      font-weight: 900; 
      font-size: 1.5rem; 
      cursor: pointer; 
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-qty:active { background: rgba(255, 255, 255, 0.5); transform: scale(0.92); }
    .qty-number { font-size: 1.35rem; font-weight: 900; min-width: 24px; color: #ffffff; }

    /* Fixed Checkout Footer */
    .checkout-panel { 
      position: fixed; 
      bottom: 0; left: 0; right: 0; 
      background: #0f0303;
      border-top: 1px solid rgba(255, 255, 255, 0.25); 
      padding: 12px 16px; 
      z-index: 10; 
    }
    .total-row { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 800; margin-bottom: 10px; color: #ffffff; }
    .total-row span:last-child { color: #4ade80; }
    .actions { display: flex; gap: 10px; }
    .btn-pay { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 800; color: white; cursor: pointer; }
    .btn-pay:active { transform: scale(0.96); }
    .btn-cash { background: #16a34a; }
    .btn-upi { background: #2563eb; }

    /* Manage Menu Settings */
    .section-card { 
      background: rgba(255, 255, 255, 0.08); 
      border-radius: 14px; 
      padding: 16px; 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      margin-bottom: 14px; 
    }
    .section-card h3 { font-size: 1.1rem; margin-bottom: 10px; color: #ffffff; }
    .form-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
    .form-group input { padding: 12px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; font-size: 1rem; background: rgba(0,0,0,0.4); color: white; }
    .btn-action { background: #dc2626; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .item-list-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-delete { background: #fee2e2; color: #991b1b; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* Monospaced Thermal Slip Modal */
    #token-modal { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.85); 
      align-items: center; 
      justify-content: center; 
      padding: 16px; 
      z-index: 999; 
    }
    .receipt-paper { 
      background: #fafafa; 
      color: #111827; 
      width: 100%; 
      max-width: 320px; 
      padding: 20px 16px; 
      border-radius: 4px; 
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      line-height: 1.35;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      position: relative;
    }
    .receipt-paper::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 0; right: 0;
      height: 10px;
      background: linear-gradient(135deg, transparent 5px, #fafafa 5px) 0 0,
                  linear-gradient(-135deg, transparent 5px, #fafafa 5px) 0 0;
      background-size: 10px 10px;
      background-repeat: repeat-x;
    }
    .receipt-center { text-align: center; }
    .receipt-bold { font-weight: 900; }
    .receipt-divider { border-top: 1px dashed #6b7280; margin: 8px 0; }
    .receipt-row { display: flex; justify-content: space-between; }
    .receipt-col-name { width: 44%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
    .receipt-col-qty { width: 30%; text-align: center; }
    .receipt-col-total { width: 26%; text-align: right; }

    /* Sales Register */
    .sales-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .metric { background: rgba(255, 255, 255, 0.08); padding: 12px 6px; border-radius: 12px; text-align: center; }
    .metric span { display: block; font-size: 0.9rem; color: #9ca3af; margin-bottom: 4px; }
    .metric strong { font-size: 1.25rem; color: #ffffff; font-weight: 900; }
    .table-container { background: rgba(255, 255, 255, 0.06); border-radius: 14px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    th { background: rgba(255, 255, 255, 0.1); font-weight: 700; color: #e5e7eb; }
    .btn-export { background: rgba(255,255,255,0.15); color: white; padding: 14px; border-radius: 12px; width: 100%; font-size: 1rem; font-weight: 800; margin-top: 12px; cursor: pointer; border: none; }
  </style>
</head>
<body>

  <header>
    <h1 id="display-shop-name">Sri Tiffin POS</h1>
    <div class="token-badge">Next: #<span id="next-token-id">1</span></div>
  </header>

  <div class="status-strip">
    <div class="status-pill" onclick="alert('POS is actively saving to device storage.')">
      <span class="status-dot"></span>
      <span>Storage: Active</span>
    </div>
    <div class="status-pill" onclick="connectPrinter()">
      <span class="status-dot" id="printer-dot" style="background:#9ca3af;"></span>
      <span id="printer-label">Printer: Connect</span>
    </div>
  </div>

  <div class="nav-tabs">
    <button id="tab-billing" class="active" onclick="switchView('billing')">Order POS</button>
    <button id="tab-sales" onclick="switchView('sales')">Daily Sales</button>
    <button id="tab-manage" onclick="switchView('manage')">Manage Menu</button>
  </div>

  <!-- 1. POS VIEW -->
  <div id="view-billing">
    <div class="menu-grid" id="menu-container"></div>
    <div class="checkout-panel">
      <div class="total-row">
        <span>Total:</span>
        <span>₹<span id="pos-total">0</span></span>
      </div>
      <div class="actions">
        <button class="btn-pay btn-cash" type="button" onclick="generateToken('Cash')">Cash Pay</button>
        <button class="btn-pay btn-upi" type="button" onclick="generateToken('UPI')">UPI Pay</button>
      </div>
    </div>
  </div>

  <!-- 2. SALES VIEW -->
  <div id="view-sales" style="display: none;">
    <div class="sales-summary">
      <div class="metric"><span>Tokens</span><strong id="stat-tokens">0</strong></div>
      <div class="metric"><span>UPI (₹)</span><strong id="stat-upi">0</strong></div>
      <div class="metric"><span>Total (₹)</span><strong id="stat-total">0</strong></div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr><th>Token</th><th>Items</th><th>Pay</th><th>₹</th></tr>
        </thead>
        <tbody id="sales-rows"></tbody>
      </table>
    </div>

    <button class="btn-export" onclick="exportToCSV()">Download Sales (CSV)</button>
    <button class="btn-export" style="background: #b91c1c; margin-top:8px;" onclick="resetDay()">Reset Day Counter</button>
  </div>

  <!-- 3. MANAGE VIEW -->
  <div id="view-manage" style="display: none;">
    <div class="section-card">
      <h3>Shop Name</h3>
      <div class="form-group" style="flex-direction: row;">
        <input type="text" id="input-shop-name" placeholder="Enter Shop Name" style="flex:1;" />
        <button class="btn-action" onclick="updateShopName()">Save</button>
      </div>
    </div>

    <div class="section-card">
      <h3>Add New Menu Item</h3>
      <div class="form-group">
        <input type="text" id="new-item-name" placeholder="Item Name (e.g. Bonda)" />
        <input type="number" id="new-item-price" placeholder="Price (₹)" />
        <label style="font-size: 0.85rem; color: #d1d5db;">Upload Photo:</label>
        <input type="file" id="new-item-file" accept="image/*" />
        <button class="btn-action" style="margin-top: 4px;" onclick="addItem()">Add to Menu</button>
      </div>
    </div>

    <div class="section-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3>Current Menu</h3>
        <button onclick="restoreDefaults()" style="font-size: 0.75rem; background: rgba(255,255,255,0.2); color:white; border:none; padding:6px 10px; border-radius:6px; cursor:pointer;">Reset Defaults</button>
      </div>
      <div id="manage-menu-list"></div>
    </div>
  </div>

  <!-- THERMAL RECEIPT MODAL PREVIEW -->
  <div id="token-modal" onclick="closeModal()">
    <div style="display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 320px;" onclick="event.stopPropagation()">
      <div class="receipt-paper" id="receipt-preview-content"></div>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn-pay btn-cash" style="padding: 12px; font-size: 1rem;" onclick="reprintCurrentToken()">
          🖨️ Print Slip
        </button>
        <button class="btn-pay" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); padding: 12px; font-size: 1rem;" onclick="closeModal()">
          Next Order
        </button>
      </div>
    </div>
  </div>

  <script>
    // Fail-safe default menu
    const DEFAULT_ITEMS = [
      { id: 1, name: "Idli (4)", price: 40, image: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=400&auto=format&fit=crop&q=80" },
      { id: 2, name: "Wada (2)", price: 45, image: "https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?w=400&auto=format&fit=crop&q=80" },
      { id: 3, name: "Masala Dosa", price: 55, image: "https://images.unsplash.com/photo-1668236543090-82eba5ee5976?w=400&auto=format&fit=crop&q=80" },
      { id: 4, name: "Plain Dosa", price: 45, image: "https://images.unsplash.com/photo-1668236543090-82eba5ee5976?w=400&auto=format&fit=crop&q=80" },
      { id: 5, name: "Poori (2)", price: 50, image: "https://images.unsplash.com/photo-1601050690597-df0568f70950?w=400&auto=format&fit=crop&q=80" },
      { id: 6, name: "Filter Coffee", price: 20, image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=400&auto=format&fit=crop&q=80" }
    ];

    let shopName = "Sri Tiffin POS";
    let menu = DEFAULT_ITEMS;
    let localSales = [];
    let currentToken = 1;
    let cart = {};
    let printCharacteristic = null;
    let lastOrderRecord = null;
    let lastOrderItems = null;

    // Load state safely
    try {
      shopName = localStorage.getItem("pos_shop_name") || "Sri Tiffin POS";
      const savedMenu = localStorage.getItem("pos_menu");
      if (savedMenu) menu = JSON.parse(savedMenu);
      const savedSales = localStorage.getItem("pos_sales");
      if (savedSales) localSales = JSON.parse(savedSales);
      currentToken = parseInt(localStorage.getItem("pos_token") || "1", 10);
    } catch (e) {
      console.warn("Storage reset due to corrupted state:", e);
      localStorage.clear();
      menu = DEFAULT_ITEMS;
    }

    // Render POS Grid immediately
    document.getElementById("display-shop-name").innerText = shopName;
    document.getElementById("input-shop-name").value = shopName;
    document.getElementById("next-token-id").innerText = currentToken;

    function renderPOSGrid() {
      const grid = document.getElementById("menu-container");
      grid.innerHTML = "";
      menu.forEach(item => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <img class="card-img" src="${item.image || 'https://placehold.co/400x300?text=Tiffin'}" alt="${item.name}" onerror="this.src='https://placehold.co/400x300?text=Tiffin'" />
          <div class="card-body">
            <h4>${item.name}</h4>
            <div class="price">₹${item.price}</div>
            <div class="controls">
              <button class="btn-qty" type="button" onclick="changeQty(${item.id}, -1)">-</button>
              <span class="qty-number" id="qty-${item.id}">${cart[item.id] || 0}</span>
              <button class="btn-qty" type="button" onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function changeQty(id, delta) {
      cart[id] = Math.max(0, (cart[id] || 0) + delta);
      const el = document.getElementById(`qty-${id}`);
      if (el) el.innerText = cart[id];
      
      let total = 0;
      for (let itemId in cart) {
        const item = menu.find(m => m.id == itemId);
        if (item) total += cart[itemId] * item.price;
      }
      document.getElementById("pos-total").innerText = total;
    }

    function generateToken(mode) {
      const selected = menu.filter(m => (cart[m.id] || 0) > 0);
      if (!selected.length) {
        alert("Please add at least one item!");
        return;
      }

      const total = parseInt(document.getElementById("pos-total").innerText, 10);
      const itemsPurchased = selected.map(m => `${m.name} x${cart[m.id]}`);
      const todayFormatted = new Date().toLocaleDateString('en-GB');

      const record = {
        token: currentToken,
        date: todayFormatted,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        items: itemsPurchased.join(", "),
        total: total,
        mode: mode
      };

      localSales.push(record);
      localStorage.setItem("pos_sales", JSON.stringify(localSales));

      lastOrderRecord = record;
      lastOrderItems = selected.map(m => ({
        name: m.name,
        qty: cart[m.id],
        price: m.price,
        subTotal: m.price * cart[m.id]
      }));

      // Show paper receipt preview
      renderReceiptPreview(record, lastOrderItems);
      document.getElementById("token-modal").style.display = "flex";

      if (printCharacteristic) {
        printThermalSlip(record, lastOrderItems);
      }

      currentToken++;
      localStorage.setItem("pos_token", currentToken);
      document.getElementById("next-token-id").innerText = currentToken;

      cart = {};
      menu.forEach(m => {
        const el = document.getElementById(`qty-${m.id}`);
        if (el) el.innerText = "0";
      });
      document.getElementById("pos-total").innerText = "0";
    }

    function renderReceiptPreview(record, items) {
      const totalQty = items.reduce((sum, item) => sum + item.qty, 0);

      const itemsHtml = items.map(item => `
        <div class="receipt-row">
          <span class="receipt-col-name">${item.name}</span>
          <span class="receipt-col-qty">${item.qty}/${item.price.toFixed(2)}</span>
          <span class="receipt-col-total">${item.subTotal.toFixed(2)}</span>
        </div>
      `).join('');

      document.getElementById("receipt-preview-content").innerHTML = `
        <div class="receipt-center receipt-bold" style="font-size: 1.15rem;">${shopName}</div>
        <div class="receipt-center" style="font-size: 0.75rem; color: #4b5563;">Main Road, Near Bus Stand</div>
        <div class="receipt-center" style="font-size: 0.75rem; color: #4b5563;">Phone: 9876543210</div>
        
        <div class="receipt-divider"></div>
        
        <div style="font-size: 0.8rem;">Bill To: ${record.mode} Sale</div>
        <div class="receipt-row" style="font-size: 0.8rem;">
          <span>Bill No: ${record.token}</span>
          <span>Date: ${record.date}</span>
        </div>
        
        <div class="receipt-divider"></div>
        
        <div class="receipt-row receipt-bold">
          <span class="receipt-col-name">Item Name</span>
          <span class="receipt-col-qty">Qty/Rate</span>
          <span class="receipt-col-total">Total</span>
        </div>
        
        <div class="receipt-divider"></div>
        
        ${itemsHtml}
        
        <div class="receipt-divider"></div>
        
        <div class="receipt-row">
          <span>Total Qty: ${totalQty}</span>
          <span>Sub Total: ${record.total.toFixed(2)}</span>
        </div>
        
        <div class="receipt-divider"></div>
        
        <div class="receipt-center receipt-bold" style="font-size: 1.1rem; margin: 4px 0;">
          Grand Total ${record.total.toFixed(2)}
        </div>
        
        <div class="receipt-divider"></div>
        
        <div class="receipt-center" style="font-size: 0.78rem; margin-top: 4px;">
          Thank you for ordering!<br>Please visit again.
        </div>
        <div class="receipt-center" style="font-size: 0.7rem; color: #6b7280; margin-top: 4px;">
          Powered by ${shopName}
        </div>
      `;
    }

    async function reprintCurrentToken() {
      if (!printCharacteristic) {
        alert("Printer not connected! Tap 'Printer: Connect' at the top first.");
        return;
      }
      if (lastOrderRecord && lastOrderItems) {
        await printThermalSlip(lastOrderRecord, lastOrderItems);
