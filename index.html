<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiffin POS & Tokens</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#b91c1c" />
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: #f3f4f6; padding: 12px; padding-bottom: 110px; }
    header { background: #b91c1c; color: white; padding: 12px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .token-badge { background: #fee2e2; color: #991b1b; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .nav-tabs button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; background: #e5e7eb; color: #374151; }
    .nav-tabs button.active { background: #b91c1c; color: white; }
    .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .card { background: white; border-radius: 8px; padding: 12px; text-align: center; border: 1px solid #e5e7eb; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .card h4 { font-size: 1rem; color: #1f2937; }
    .card .price { color: #047857; font-weight: bold; margin: 4px 0 8px; }
    .controls { display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-qty { width: 30px; height: 30px; background: #e5e7eb; border: none; border-radius: 4px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
    .checkout-panel { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 2px solid #e5e7eb; padding: 10px 16px; box-shadow: 0 -3px 8px rgba(0,0,0,0.08); }
    .total-row { display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: bold; margin-bottom: 8px; }
    .actions { display: flex; gap: 8px; }
    .btn-pay { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 700; color: white; cursor: pointer; }
    .btn-cash { background: #16a34a; }
    .btn-upi { background: #2563eb; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 16px; z-index: 99; }
    .slip { background: white; width: 100%; max-width: 320px; padding: 20px; border-radius: 10px; text-align: center; }
    .slip .t-num { font-size: 2.8rem; font-weight: 900; color: #b91c1c; margin: 10px 0; }
    .slip-details { text-align: left; border-top: 1px dashed #9ca3af; border-bottom: 1px dashed #9ca3af; padding: 8px 0; margin: 10px 0; font-size: 0.85rem; }
    .sales-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .metric { background: white; padding: 10px; border-radius: 6px; text-align: center; border: 1px solid #e5e7eb; }
    .metric span { display: block; font-size: 0.75rem; color: #6b7280; }
    .metric strong { font-size: 1.05rem; color: #111827; }
    .table-container { background: white; border-radius: 6px; border: 1px solid #e5e7eb; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #f3f4f6; }
    th { background: #f9fafb; font-weight: 600; }
    .btn-export { background: #374151; color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; font-weight: bold; margin-top: 12px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div>
      <strong style="font-size: 1.1rem;">Sri Tiffin POS</strong>
    </div>
    <div class="token-badge">Next: #<span id="next-token-id">1</span></div>
  </header>

  <div class="nav-tabs">
    <button id="tab-billing" class="active" onclick="switchView('billing')">Order POS</button>
    <button id="tab-sales" onclick="switchView('sales')">Daily Sales</button>
  </div>

  <div id="view-billing">
    <div class="menu-grid" id="menu-container"></div>
    <div class="checkout-panel">
      <div class="total-row">
        <span>Total Payable:</span>
        <span>₹<span id="pos-total">0</span></span>
      </div>
      <div class="actions">
        <button class="btn-pay btn-cash" onclick="generateToken('Cash')">Cash Order</button>
        <button class="btn-pay btn-upi" onclick="generateToken('UPI')">UPI Order</button>
      </div>
    </div>
  </div>

  <div id="view-sales" style="display: none;">
    <div class="sales-summary">
      <div class="metric"><span>Tokens</span><strong id="stat-tokens">0</strong></div>
      <div class="metric"><span>UPI (₹)</span><strong id="stat-upi">0</strong></div>
      <div class="metric"><span>Total (₹)</span><strong id="stat-total">0</strong></div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Token</th>
            <th>Items</th>
            <th>Pay</th>
            <th>₹</th>
          </tr>
        </thead>
        <tbody id="sales-rows"></tbody>
      </table>
    </div>

    <button class="btn-export" onclick="exportToCSV()">Download Sales (CSV)</button>
    <button class="btn-export" style="background: #991b1b; margin-top: 6px;" onclick="resetDay()">Reset for New Day</button>
  </div>

  <div class="modal" id="token-modal">
    <div class="slip">
      <h3>TOKEN</h3>
      <div class="t-num" id="print-token">#0</div>
      <div class="slip-details" id="print-summary"></div>
      <p style="font-size: 0.9rem; font-weight: bold; margin-bottom: 12px;">Total: ₹<span id="print-total">0</span></p>
      <button class="btn-pay btn-cash" style="width: 100%;" onclick="closeModal()">Next Order</button>
    </div>
  </div>

  <script>
    const menu = [
      { id: 1, name: "Idli (4)", price: 40 },
      { id: 2, name: "Wada (2)", price: 45 },
      { id: 3, name: "Masala Dosa", price: 55 },
      { id: 4, name: "Plain Dosa", price: 45 },
      { id: 5, name: "Poori (2)", price: 50 },
      { id: 6, name: "Tea / Coffee", price: 15 }
    ];

    let cart = {};
    let sales = JSON.parse(localStorage.getItem("pos_sales") || "[]");
    let currentToken = parseInt(localStorage.getItem("pos_token") || "1", 10);

    function init() {
      document.getElementById("next-token-id").innerText = currentToken;
      const grid = document.getElementById("menu-container");
      grid.innerHTML = menu.map(m => `
        <div class="card">
          <h4>${m.name}</h4>
          <div class="price">₹${m.price}</div>
          <div class="controls">
            <button class="btn-qty" onclick="changeQty(${m.id}, -1)">-</button>
            <strong id="qty-${m.id}">0</strong>
            <button class="btn-qty" onclick="changeQty(${m.id}, 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    function changeQty(id, change) {
      cart[id] = Math.max(0, (cart[id] || 0) + change);
      document.getElementById(`qty-${id}`).innerText = cart[id];
      let total = 0;
      for (let itemId in cart) {
        const item = menu.find(m => m.id == itemId);
        total += cart[itemId] * item.price;
      }
      document.getElementById("pos-total").innerText = total;
    }

    function generateToken(mode) {
      const selected = menu.filter(m => cart[m.id] > 0);
      if (!selected.length) {
        alert("Cart is empty!");
        return;
      }

      const total = parseInt(document.getElementById("pos-total").innerText, 10);
      const itemsPurchased = selected.map(m => `${m.name} x${cart[m.id]}`);

      const record = {
        token: currentToken,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        items: itemsPurchased.join(", "),
        total: total,
        mode: mode
      };

      sales.push(record);
      localStorage.setItem("pos_sales", JSON.stringify(sales));

      document.getElementById("print-token").innerText = `#${currentToken}`;
      document.getElementById("print-summary").innerHTML = selected.map(m => `<div>${m.name} x ${cart[m.id]} - ₹${m.price * cart[m.id]}</div>`).join('');
      document.getElementById("print-total").innerText = total;
      document.getElementById("token-modal").style.display = "flex";

      currentToken++;
      localStorage.setItem("pos_token", currentToken);
      document.getElementById("next-token-id").innerText = currentToken;

      cart = {};
      menu.forEach(m => document.getElementById(`qty-${m.id}`).innerText = "0");
      document.getElementById("pos-total").innerText = "0";
    }

    function closeModal() {
      document.getElementById("token-modal").style.display = "none";
    }

    function switchView(tab) {
      const isPOS = tab === 'billing';
      document.getElementById("view-billing").style.display = isPOS ? 'block' : 'none';
      document.getElementById("view-sales").style.display = isPOS ? 'none' : 'block';
      document.getElementById("tab-billing").className = isPOS ? 'active' : '';
      document.getElementById("tab-sales").className = !isPOS ? 'active' : '';
      if (!isPOS) renderSales();
    }

    function renderSales() {
      const rows = document.getElementById("sales-rows");
      const totalAmt = sales.reduce((acc, s) => acc + s.total, 0);
      const upiAmt = sales.filter(s => s.mode === "UPI").reduce((acc, s) => acc + s.total, 0);

      document.getElementById("stat-tokens").innerText = sales.length;
      document.getElementById("stat-upi").innerText = upiAmt;
      document.getElementById("stat-total").innerText = totalAmt;

      rows.innerHTML = sales.slice().reverse().map(s => `
        <tr>
          <td><strong>#${s.token}</strong><br><small style="color:#666;">${s.time}</small></td>
          <td>${s.items}</td>
          <td><span style="color:${s.mode === 'UPI' ? '#2563eb' : '#16a34a'}; font-weight: bold;">${s.mode}</span></td>
          <td><strong>₹${s.total}</strong></td>
        </tr>
      `).join('');
    }

    function exportToCSV() {
      if (!sales.length) return alert("No sales recorded yet.");
      let csv = "Token,Time,Items,Payment Mode,Total Amount\n";
      sales.forEach(s => {
        csv += `"${s.token}","${s.time}","${s.items}","${s.mode}","${s.total}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `tiffin_sales_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function resetDay() {
      if (confirm("Reset token counter to 1 and clear today's records? Make sure to download the CSV first.")) {
        sales = [];
        currentToken = 1;
        localStorage.removeItem("pos_sales");
        localStorage.setItem("pos_token", "1");
        document.getElementById("next-token-id").innerText = "1";
        renderSales();
      }
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }

    init();
  </script>
</body>
</html>
